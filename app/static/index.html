<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Document Q&A Chatbot</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --border: #2a2e3a;
    --text: #e8e9ed; --muted: #8b8fa3; --accent: #6366f1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex;
  }
  .sidebar {
    width: 300px; background: var(--panel); border-right: 1px solid var(--border);
    padding: 20px; display: flex; flex-direction: column; gap: 16px;
  }
  .sidebar h2 { font-size: 16px; margin: 0 0 4px; }
  .sidebar p { font-size: 13px; color: var(--muted); margin: 0; }
  .upload-box {
    border: 1.5px dashed var(--border); border-radius: 10px; padding: 16px;
    text-align: center; font-size: 13px; color: var(--muted);
  }
  input[type=file] { width: 100%; margin-top: 10px; font-size: 12px; color: var(--muted); }
  button {
    background: var(--accent); color: white; border: none; padding: 10px;
    border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  button:hover { opacity: 0.9; }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .active-doc {
    font-size: 12px; background: #1e2230; padding: 10px; border-radius: 8px; color: var(--muted);
  }
  .main { flex: 1; display: flex; flex-direction: column; }
  .header { padding: 18px 24px; border-bottom: 1px solid var(--border); }
  .header h1 { font-size: 18px; margin: 0; }
  .chat { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 70%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 14px; }
  .msg.user { align-self: flex-end; background: var(--accent); color: white; }
  .msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .sources { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .input-row { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
  .input-row input {
    flex: 1; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 14px; outline: none;
  }
  .spinner { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>

<div class="sidebar">
  <h2>📄 Document Q&A</h2>
  <p>Upload any PDF and chat with it.</p>

  <div class="upload-box">
    <div>Upload a PDF</div>
    <input type="file" id="fileInput" accept=".pdf">
    <br><br>
    <button onclick="uploadFile()">Process PDF</button>
  </div>

  <div class="active-doc" id="activeDoc">Active: Default (BDA, IoT, Parallel Computing)</div>
  <button class="secondary" onclick="resetDefault()">Reset to default docs</button>
</div>

<div class="main">
  <div class="header"><h1>Ask a question about your document</h1></div>
  <div class="chat" id="chat"></div>
  <div class="input-row">
    <input type="text" id="questionInput" placeholder="Type your question..." onkeydown="if(event.key==='Enter') ask()">
    <button onclick="ask()">Send</button>
  </div>
</div>

<script>
const API = "";
let collectionId = "default";

function addMessage(role, text, sources) {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = text.replace(/\n/g, "<br>");
  if (sources && sources.length) {
    const s = document.createElement("div");
    s.className = "sources";
    s.innerHTML = "📚 " + sources.map(s => `${s.file} (p.${s.page})`).join(", ");
    div.appendChild(s);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function ask() {
  const input = document.getElementById("questionInput");
  const question = input.value.trim();
  if (!question) return;
  addMessage("user", question);
  input.value = "";

  const loading = document.createElement("div");
  loading.className = "msg bot spinner";
  loading.textContent = "Thinking...";
  document.getElementById("chat").appendChild(loading);

  const res = await fetch(`${API}/ask`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question, collection_id: collectionId })
  });
  const data = await res.json();
  loading.remove();
  addMessage("bot", data.answer || "Something went wrong.", data.sources);
}

async function uploadFile() {
  const fileInput = document.getElementById("fileInput");
  if (!fileInput.files.length) return alert("Choose a PDF first.");

  const formData = new FormData();
  formData.append("file", fileInput.files[0]);

  document.getElementById("activeDoc").textContent = "Processing...";
  const res = await fetch(`${API}/upload`, { method: "POST", body: formData });
  const data = await res.json();

  if (data.error) {
    alert(data.error);
    document.getElementById("activeDoc").textContent = "Active: Default";
    return;
  }
  collectionId = data.collection_id;
  document.getElementById("activeDoc").textContent = `Active: ${data.filename} (${data.chunks_created} chunks)`;
}

function resetDefault() {
  collectionId = "default";
  document.getElementById("activeDoc").textContent = "Active: Default (BDA, IoT, Parallel Computing)";
}
</script>
</body>
</html>
